# Configuração do Starship (versionada em zshmap-extras).
# Edite aqui; o symlink em ~/.config/starship.toml aponta para este ficheiro.
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 50
command_timeout = 800
add_newline = false

# 1ª linha: nome da máquina (📍 local / 🌐 SSH); $fill → relógio à direita, sempre
# 2ª linha: diretório completo, stacks (sem git); $fill → duração/bateria à direita
# 3ª linha: branch + estado do repositório + métricas + indicador de assinatura
# 4ª linha: ╰─ + ❯
format = """
$os${custom.host-local}$hostname$fill$time
[│](bold blue) ${custom.path_display}${custom.laravel}$package${custom.nodejs}$rust$golang$php${custom.php-local}${custom.php-project}${custom.docker-compose}$docker_context$fill$cmd_duration$battery${vcs}
[╰─](bold blue)$sudo$status$character"""

[username]
disabled = false
show_always = true
style_user = "bold fg:39"
style_root = "bold red"
format = "[$user]($style)"

# Nome da máquina sempre visível; em sessão SSH ganha o ícone 🌐 (local: 📍 via custom.host-local)
[hostname]
disabled = false
ssh_only = false
ssh_symbol = "🌐 "
format = "[$ssh_symbol$hostname](bold blue) "

[os]
disabled = false
style = "bold blue"
format = "[╭─](bold blue) "

# Ícone 📍 antes do nome da máquina quando a sessão é local.
# Usa a mesma variável que o módulo hostname para detetar SSH (SSH_CONNECTION),
# para nunca aparecerem os dois ícones ao mesmo tempo.
[custom.host-local]
description = "Ícone de sessão local (fora de SSH)"
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
when = '[[ -z "${SSH_CONNECTION:-}" ]]'
command = "printf '📍'"
format = "$output "

[package]
format = "📦 [$version]($style) "
version_format = "${raw}"
display_private = true
style = "bold 208"

[fill]
symbol = " "
style = "bold black"

[git_branch]
# 󰘬 = ícone de branch (Nerd Font); padrão Starship: 
symbol = "󰘬 "
style = "bold 208"
format = " [$symbol$branch(:$remote_branch)]($style) "

# Estado do repo (estilo Powerlevel10k): staged, alterado, untracked, pull/push pendentes
# Espaço no fim de cada indicador separa !4 ?12 em vez de !4?12
[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold white"
conflicted = "[=](bold red) "
stashed = "[$](bold yellow) "
deleted = "[✘${count}](bold red) "
renamed = "[»${count}](bold purple) "
staged = "[+${count}](bold green) "
index_modified = "[●${count}](bold green) "
index_added = "[+${count}](bold green) "
index_deleted = "[✘${count}](bold red) "
modified = "[!${count}](bold yellow) "
worktree_modified = "[!${count}](bold yellow) "
untracked = "[?${count}](bold cyan) "
worktree_added = "[?${count}](bold cyan) "
ahead = "[⇡${count}](bold green) "
behind = "[⇣${count}](bold red) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold yellow) "
up_to_date = ""

[git_metrics]
disabled = false
format = "([+${added}]($added_style) )([-${deleted}]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true

[vcs]
git_modules = "\n[│](bold blue) $git_branch$git_status$git_metrics${custom.git-signing}"

[sudo]
disabled = false
format = "[$symbol]($style) "
symbol = "🧙"

[status]
disabled = false
format = "[$symbol]($style) "
symbol = "❌"
success_symbol = ""
map_symbol = true
not_executable_symbol = "🚫"
not_found_symbol = "🚫"
sigint_symbol = "🧱"
signal_symbol = "⚡"
style = "bold red"

[custom.git-signing]
description = "Indicador de commit assinado (commit.gpgsign)"
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
when = "true"
command = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1; if git config --bool --get commit.gpgsign >/dev/null 2>&1; then if [[ "$(git config --bool --get commit.gpgsign 2>/dev/null)" == "true" ]]; then printf "🔏"; else printf "🔓"; fi; else printf "🔓?"; fi'
format = "[$output](bold green) "

[custom.path_display]
description = "Caminho com regra especial para Projects e Documents"
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
when = "true"
command = '''
if [[ "$PWD" == "$HOME" ]]; then
	printf '🏠 ~/'
elif [[ "$PWD" == "$HOME/Projects/"* ]]; then
	printf 'Project: 💼 %s' "${PWD#"$HOME/Projects/"}"
else
	printf '📂 ~/%s' "${PWD#"$HOME/"}"
fi
'''
format = "[$output]($style) "

[cmd_duration]
min_time = 1000
show_milliseconds = true
format = "⏱  [$duration]($style) "
style = "bold yellow"

[time]
disabled = false
use_12hr = false
time_format = "%H:%M:%S"
format = "⏰ [$time]($style) "
style = "bold 245"

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡ "
discharging_symbol = "💀 "
format = "[$symbol$percentage]($style) "
disabled = false

[[battery.display]]
threshold = 20
style = "bold red"

[docker_context]
format = "via [🐳 $context](bold blue) "
only_with_files = true

# Node nativo não suporta `when`; usamos custom.nodejs com a mesma regra Laravel
[nodejs]
disabled = true

[custom.nodejs]
description = "Node.js (só em projeto Node; oculto em Laravel)"
# detect_* omitido: o `when` abaixo decide tudo (Starship mostra só com when=0 mesmo sem ficheiros)
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
when = 'bash "${ZSHMAP_EXTRAS_DIR:-$HOME/Projects/zshmap-extras}/bin/starship-should-show-nodejs.sh"'
command = "node --version 2>/dev/null | tr -d '\\n\\r'"
format = "via [$symbol$output ]($style) "
symbol = " "
style = "bold green"

[custom.laravel]
description = "Ícone Laravel (artisan + laravel/framework)"
detect_files = ["artisan", "composer.json"]
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
when = "false"
command = 'bash "${ZSHMAP_EXTRAS_DIR:-$HOME/Projects/zshmap-extras}/bin/starship-laravel-icon.sh" 2>/dev/null'
format = "[$output](bold red) "

[custom.docker-compose]
description = "Containers do docker compose (diretório atual)"
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
ignore_timeout = true
when = "false"
command = 'bash "${ZSHMAP_EXTRAS_DIR:-$HOME/Projects/zshmap-extras}/bin/starship-docker-compose-status.sh" 2>/dev/null'
format = "🐳 [containers: $output](bold blue) "

[character]
success_symbol = "[➜](bold blue)"
error_symbol = "[➜](bold red)"

# Define custom colors
[palettes.foo]
# Overwrite existing color
blue = '21'
# Define new color
mustard = '#af8700'

# PHP instalado no host (`php` no PATH)
[custom.php-local]
description = "PHP instalado no host"
shell = ["bash", "--noprofile", "-c"]
use_stdin = false
when = "command -v php >/dev/null 2>&1"
command = "php -r 'echo PHP_VERSION;' 2>/dev/null"
format = "via [php local $output](242) "

# PHP exigido pelo projeto (composer.json → require.php)
[custom.php-project]
description = "PHP do projeto (composer.json)"
detect_files = ["composer.json"]
format = "[php $output](147 bold) "
use_stdin = false
shell = ["bash", "--noprofile", "-c"]
when = "command -v jq >/dev/null 2>&1 && jq -e '.require.php' composer.json >/dev/null 2>&1"
command = "jq -r '.require.php' composer.json 2>/dev/null"
